<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sharingan · Theme preview</title>
  <style>
    *{box-sizing:border-box}body{--preview-width:min(1440px,94vw,calc((100vh - 180px)*16/9));margin:0;background:#070a10;color:#e9edf6;font:14px system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 3vw;gap:20px}
    header,footer{width:var(--preview-width);margin:0 auto}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{margin:0;font-size:20px;font-weight:500;letter-spacing:-.02em}header small{display:block;color:#8996ac;font-size:12px;margin-top:6px}nav{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;border:1px solid #31394a;background:#111722;border-radius:8px;color:#bac5d6;padding:10px 14px;cursor:pointer}button[aria-pressed="true"]{color:#ffdd99;border-color:#c19b5a;background:#322719}button:focus-visible{outline:2px solid #ffe3ad;outline-offset:3px}.screen-wrap{width:var(--preview-width);margin:0 auto;aspect-ratio:16/9;box-shadow:0 20px 80px #000a;border:1px solid #263044;border-radius:8px;overflow:hidden;background:#030810}iframe{border:0;width:100%;height:100%;display:block}footer{color:#8d9bb1;font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}a{color:#c5d4e8}
  </style>
</head>
<body>
  <header><div><h1>Sharingan</h1><small>Naruto & Kurama · animated theme preview</small></div><nav aria-label="Preview theme"><button data-theme="kurama" aria-pressed="true">Nine-Tails Moon</button><button data-theme="chakra" aria-pressed="false">Chakra Sync</button></nav></header>
  <div class="screen-wrap"><iframe id="screen" title="Sharingan TV dashboard" allow="autoplay"></iframe></div>
  <footer><span>Click inside the dashboard · ← → Select an app · Enter Preview its power</span><span>Local preview · app launches are simulated</span></footer>
  <script>
    const frame=document.getElementById('screen'),choices=[...document.querySelectorAll('[data-theme]')];
    function showTheme(id){id=id==='chakra'?'chakra':'kurama';choices.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===id)));frame.src='app/?theme='+id;history.replaceState(null,'','?theme='+id);}
    choices.forEach(button=>button.addEventListener('click',()=>showTheme(button.dataset.theme)));
    window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==frame.contentWindow||event.data?.type!=='sharingan-theme')return;const id=event.data.theme;choices.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===id)));if(['kurama','chakra'].includes(id))history.replaceState(null,'','?theme='+id);});
    showTheme(new URLSearchParams(location.search).get('theme'));
  </script>
</body>
</html>
